<div id="adminEncryptedContainer">
  <div id="adminAuthModal" class="admin-auth-overlay">
    <div class="admin-auth-box">
      <div class="admin-auth-icon">🔒</div>
      <h2 class="admin-auth-title">Admin Portal Locked</h2>
      <p class="admin-auth-subtitle">Enter the password to decrypt and load this page.</p>

      <form id="adminAuthForm" onsubmit="return false;" autocomplete="off">
        <div class="admin-auth-field">
          <label for="adminAuthPassword">Password</label>
          <input 
            type="password" 
            id="adminAuthPassword" 
            class="admin-auth-input" 
            placeholder="Enter password..." 
            required 
            autofocus 
            autocomplete="current-password"
          >
        </div>

        <div id="adminAuthError" class="admin-auth-error" style="display: none;">
          Incorrect password. Decryption failed.
        </div>

        <button type="submit" id="adminAuthSubmit" class="admin-auth-btn">
          Unlock & Decrypt
        </button>
      </form>
      <div class="admin-auth-footer">
        <a href="{{ site.baseurl }}/" class="admin-auth-return">&larr; Return to main website</a>
      </div>
    </div>
  </div>

  <div id="adminDecryptedSlot"></div>
</div>

<script>
window.initAdminDecryptor = function(payload) {
  const STORAGE_KEY = "wsom_admin_key";
  const modal = document.getElementById("adminAuthModal");
  const form = document.getElementById("adminAuthForm");
  const passInput = document.getElementById("adminAuthPassword");
  const errorMsg = document.getElementById("adminAuthError");
  const slot = document.getElementById("adminDecryptedSlot");

  function hexToBuf(hex) {
    const bytes = new Uint8Array(hex.length / 2);
    for (let i = 0; i < hex.length; i += 2) {
      bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
    }
    return bytes;
  }

  async function deriveKey(password, saltBuf) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      "raw",
      enc.encode(password),
      "PBKDF2",
      false,
      ["deriveKey"]
    );
    return await crypto.subtle.deriveKey(
      {
        name: "PBKDF2",
        salt: saltBuf,
        iterations: 100000,
        hash: "SHA-256"
      },
      keyMaterial,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
  }

  async function decryptContent(password) {
    const salt = hexToBuf(payload.salt);
    const iv = hexToBuf(payload.iv);
    const tag = hexToBuf(payload.tag);
    const cipherData = hexToBuf(payload.data);

    // Concatenate ciphertext + tag for Web Crypto API AES-GCM
    const combined = new Uint8Array(cipherData.length + tag.length);
    combined.set(cipherData);
    combined.set(tag, cipherData.length);

    const aesKey = await deriveKey(password, salt);
    const decryptedBuffer = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: iv },
      aesKey,
      combined
    );
    return new TextDecoder().decode(decryptedBuffer);
  }

  async function tryUnlock(password) {
    try {
      const html = await decryptContent(password);
      slot.innerHTML = html;
      modal.style.display = "none";
      try {
        sessionStorage.setItem(STORAGE_KEY, password);
      } catch(e) {}

      // Execute scripts in decrypted markup
      const scripts = slot.querySelectorAll("script");
      scripts.forEach(oldScript => {
        const newScript = document.createElement("script");
        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
        newScript.textContent = oldScript.textContent;
        oldScript.parentNode.replaceChild(newScript, oldScript);
      });
      return true;
    } catch(err) {
      return false;
    }
  }

  // Check saved session
  try {
    const saved = sessionStorage.getItem(STORAGE_KEY);
    if (saved) {
      tryUnlock(saved);
    }
  } catch(e) {}

  if (form) {
    form.addEventListener("submit", async function(e) {
      e.preventDefault();
      const pass = passInput.value ? passInput.value.trim() : "";
      if (!pass) return;

      const success = await tryUnlock(pass);
      if (success) {
        if (errorMsg) errorMsg.style.display = "none";
      } else {
        if (errorMsg) {
          errorMsg.style.display = "block";
          passInput.select();
        }
      }
    });
  }
};
</script>
