# Build Settings
permalink: /:title/
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  posts:
    output: true
    permalink: /blog/:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      header_theme: "white"

exclude:
  - README.md
  - scratch
  - Gemfile
  - Gemfile.lock
